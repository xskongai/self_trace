<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SelfTrace</title><style>:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;width:330px;margin:0;padding:16px}h1{font-size:18px;margin:0 0 6px}.muted{font-size:12px;line-height:1.45;opacity:.72;margin:0 0 12px}.card{border:1px solid rgba(127,127,127,.3);border-radius:10px;padding:12px;margin-bottom:10px}.state{font-weight:700;font-size:14px;margin-bottom:8px}.row{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:5px}.row span:last-child{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}button{width:100%;padding:10px 12px;margin-top:8px;cursor:pointer;border-radius:8px;border:1px solid rgba(127,127,127,.35)}button:disabled{cursor:default;opacity:.5}#message{min-height:16px;margin-top:10px;font-size:12px;line-height:1.4}.danger{margin-top:14px}</style></head><body><h1>SelfTrace V1.1</h1><p class="muted">Start at the top of your own X profile, then scroll normally. SelfTrace saves each post when it appears.</p><div class="card"><div class="state" id="state">Checking…</div><div class="row"><span>Profile</span><span id="handle">—</span></div><div class="row"><span>Posts saved</span><span id="postCount">0</span></div><div class="row"><span>Images found</span><span id="imageCount">0</span></div></div><button id="start">Start Collect</button><button id="stop" disabled>Stop Collect</button><button id="export">Export JSON</button><button id="clear" class="danger">Clear Saved Data</button><div id="message"></div><script src="popup.js"></script></body></html>
